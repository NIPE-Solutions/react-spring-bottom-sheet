name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      channel:
        description: npm distribution tag
        required: true
        type: choice
        options:
          - next
          - latest
      confirmation:
        description: Type "publish <version> with <channel>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run release:check

  browsers:
    name: Browser (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - run: npm run test:website:e2e -- --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  chromium-touch:
    name: Browser (chromium-touch)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium-touch
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-chromium-touch
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  verify:
    name: Verify release
    needs: [quality, browsers, chromium-touch]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release quality and browser verification passed"

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --no-audit
      - name: Validate release request
        env:
          CHANNEL: ${{ inputs.channel }}
          CONFIRMATION: ${{ inputs.confirmation }}
          VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          test "$PACKAGE_VERSION" = "$VERSION"
          test "$CONFIRMATION" = "publish $VERSION with $CHANNEL"
          if test "$CHANNEL" = "latest"; then
            test "$GITHUB_REF_NAME" = "main"
            case "$VERSION" in *-*) exit 1 ;; esac
          else
            case "$VERSION" in *-*) ;; *) exit 1 ;; esac
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already exists"
            exit 1
          fi
      - run: npm run build:dist
      - name: Publish package
        env:
          CHANNEL: ${{ inputs.channel }}
        run: npm publish --access public --tag "$CHANNEL"
      - name: Verify registry
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          MAX_ATTEMPTS=18
          RETRY_DELAY_SECONDS=10
          FETCH_TIMEOUT_MS=3000
          attempt=1
          while test "$attempt" -le "$MAX_ATTEMPTS"; do
            PUBLISHED_VERSION=$(npm view "$NAME@$VERSION" version --fetch-timeout="$FETCH_TIMEOUT_MS" --fetch-retries=0 2>/dev/null || true)
            CHANNEL_VERSION=$(npm view "$NAME@$CHANNEL" version --fetch-timeout="$FETCH_TIMEOUT_MS" --fetch-retries=0 2>/dev/null || true)
            if test "$PUBLISHED_VERSION" = "$VERSION" && test "$CHANNEL_VERSION" = "$VERSION"; then
              exit 0
            fi
            if test "$attempt" -eq "$MAX_ATTEMPTS"; then
              echo "Registry verification failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Waiting for npm registry propagation ($attempt/$MAX_ATTEMPTS)"
            sleep "$RETRY_DELAY_SECONDS"
            attempt=$((attempt + 1))
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if test "$CHANNEL" = "latest"; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes --latest
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes --prerelease --latest=false
          fi
